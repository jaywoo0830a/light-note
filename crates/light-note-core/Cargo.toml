[package]
name = "light-note-core"
description = "light-note의 플랫폼 독립 코어 — 필기 모델, 래스터라이저, hayro PDF 입출력, elm-magic 화면"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# 화면(elm-magic view!)과 어댑터의 계획(plan) 층 — 둘 다 플랫폼 독립이라
# 리눅스 CI에서 화면 계약까지 테스트된다.
elm-magic.workspace = true
elm-magic-windows-reactor.workspace = true
# PDF 읽기/래스터화 + Pixmap(vello_cpu) 재수출
hayro.workspace = true
# PDF 쓰기(내보내기)
pdf-writer.workspace = true
