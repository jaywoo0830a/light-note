[package]
name = "light-note-gui"
description = "light-note — 윈도우 11 전용 필기 앱 (elm-magic + windows-reactor, 4단계 렌더 파이프라인)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 윈도우 전용이다 — 리눅스/맥은 대상이 아니다.
# 파이프라인(①입력 ②도구 ③캔버스 ④렌더)은 순수 로직이라 `cargo test`가 WinUI 없이 돈다.

[dependencies]
elm-magic.workspace = true
elm-magic-windows-reactor.workspace = true
hayro.workspace = true
pdf-writer.workspace = true
windows-reactor.workspace = true
rfd.workspace = true
# OTD RPC(폴백) 응답/알림 파싱 — serde가 유일한 JSON 파서다(직접 스캔하지 않는다).
serde.workspace = true
serde_json.workspace = true

# Win32 `WM_POINTER` — 디지타이저(펜) 장치·필압·틸트를 읽는다(digitizer 모듈).
#
# **대상 게이트가 필요하다**: `windows` 크레이트는 Windows 대상에서만 컴파일된다.
# 그래서 계획(plan) 층만 도는 다른 플랫폼에서도 `cargo test`가 살아 있고, 필기 정책
# (`tool::CanvasTool::accepts`)과 프레임 계약(`input::PointerFrame`)은 플랫폼과 무관하게
# 테스트된다 — Win32 코드는 `digitizer::win32`(cfg(windows))에만 있다.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[[bin]]
name = "light-note-gui"
path = "src/main.rs"